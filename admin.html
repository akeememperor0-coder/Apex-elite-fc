<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Apex Elite FC Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px/1.5 system-ui,sans-serif}.box{max-width:22rem;margin:10vh auto;padding:1.5rem;text-align:center}.l{width:6rem;border-radius:50%}
input,select,textarea,button{font:inherit;padding:.6rem .8rem;border-radius:.5rem;border:1px solid #6b5a52;background:#241b1a;color:#f6ebe6;width:100%;margin:.3rem 0}textarea{min-height:7rem}
button{width:auto;background:#d9301f;border:0;cursor:pointer;color:#fff}button.g{background:none;border:1px solid #f5dfb4;color:#f5dfb4}#tb button.on{background:#d9301f;color:#fff;border-color:#d9301f}
header{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:#1a1515;position:sticky;top:0;z-index:2}header button{margin:0}
#st{display:flex;flex-wrap:wrap;gap:1.4rem;padding:1rem}#st b{display:block;font-size:1.6rem;color:#f5dfb4}#tb{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 1rem}#tb button{margin:0}
main{padding:1rem;max-width:60rem}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:34rem}td,th{text-align:left;padding:.5rem;border-bottom:1px solid #3a302d}td select,td button{width:auto;margin:0;padding:.3rem .6rem}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.6rem}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:.5rem}.ph button{margin:.2rem 0;padding:.2rem .6rem}label{display:block;margin-top:.6rem;color:#c4b1ab;font-size:.9rem}.ok{color:#8fdc8f}</style></head><body>
<div id="lg" class="box"><img class="l" src="/logo.jpg" alt=""><h1>Admin</h1><input id="c" type="password" placeholder="Admin code" aria-label="Admin code"><button onclick="go()">Open</button><p id="m"></p></div>
<div id="app" hidden><header><b>Apex Elite FC Admin</b><button class="g" onclick="out()">Log out</button></header><div id="st"></div><div id="tb"></div><main id="v"></main></div>
<script>
var C=sessionStorage.getItem("ac")||"",S=null,T="pl",TABS=[["pl","Players"],["py","Payments"],["nw","News"],["gl","Gallery"],["sf","Schedule & fees"],["ac","Account & contact"],["ws","Website"],["sc","Security"]];
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function N(n){return"\u20a6"+Number(n).toLocaleString("en-NG")}
async function call(a,d){var r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:C,action:a,data:d||{}})}),j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(j.error||"Service not connected");S=j;return j}
async function go(){C=$("c").value;try{await call("load");sessionStorage.setItem("ac",C);$("lg").hidden=true;$("app").hidden=false;view(T)}catch(e){$("m").textContent=e.message}}
function out(){sessionStorage.removeItem("ac");location.reload()}
async function act(a,d,keep){try{await call(a,d);if(!keep)view(T)}catch(e){alert(e.message)}}
function shrink(f,m,q){return new Promise(function(ok){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.src=r.result};r.readAsDataURL(f)})}
async function up(e){for(var f of e.target.files)await act("addPhoto",{img:await shrink(f,1000,.78)},1);view("gl")}
async function hero(e){if(e.target.files[0])await act("hero",{img:await shrink(e.target.files[0],1800,.82)})}
function sv(keys){var d={};keys.forEach(function(k){d[k]=$(k).value});act("settings",d);}
function lines(id,fn){return $(id).value.split("\n").map(function(l){return l.split("|").map(function(x){return x.trim()})}).filter(function(a){return a[0]}).map(fn)}
function exp(){var R=[["ID","Name","Age","Group","Parent","Phone","Position","Status"]].concat(S.players.map(function(p){return[p.id,p.name,p.age,p.grp,p.par,p.phone,p.pos,p.st]})),c=R.map(function(r){return r.map(function(v){return'"'+String(v||"").replace(/"/g,'""')+'"'}).join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="players.csv";a.click()}
function fld(k,l,t){return'<label for="'+k+'">'+l+'</label><input id="'+k+'" value="'+esc(S.settings[k])+'" '+(t?'type="'+t+'"':'')+'>'}
var V={
pl:function(){return'<button class="g" onclick="exp()">Export CSV</button><div class="sc"><table><tr><th>ID</th><th>Player</th><th>Group</th><th>Parent / phone</th><th>Status</th><th></th></tr>'+(S.players.map(function(p){return'<tr><td>'+p.id+'</td><td>'+esc(p.name)+(p.age?', '+esc(p.age):'')+(p.pos?'<br>'+esc(p.pos):'')+'</td><td>'+esc(p.grp)+'</td><td>'+esc(p.par)+'<br>'+esc(p.phone)+'</td><td><select onchange="act(\'player\',{id:\''+p.id+'\',st:this.value})">'+["Trial","Recruited","Not selected"].map(function(s){return'<option'+(s===p.st?' selected':'')+'>'+s+'</option>'}).join("")+'</select></td><td><button class="g" onclick="confirm(\'Remove this player?\')&&act(\'player\',{id:\''+p.id+'\',del:1})">Remove</button></td></tr>'}).join("")||'<tr><td colspan="6">No players yet.</td></tr>')+'</table></div>'},
py:function(){return'<div class="sc"><table><tr><th>Receipt</th><th>Player</th><th>For</th><th>Amount</th><th>Method</th><th>Status</th></tr>'+(S.pays.slice().reverse().map(function(y){return'<tr><td>'+y.ref+'<br>'+y.date+'</td><td>'+esc(y.pname)+'<br>'+y.pid+'</td><td>'+esc(y.type)+'</td><td>'+N(y.amt)+'</td><td>'+esc(y.method)+'</td><td>'+(y.st==="Pending"?'<button onclick="act(\'confirm\',{ref:\''+y.ref+'\'})">Confirm</button>':'<span class="ok">Confirmed</span>')+'</td></tr>'}).join("")||'<tr><td colspan="6">No payments yet.</td></tr>')+'</table></div>'},
nw:function(){return'<input id="nt" placeholder="News title"><textarea id="nb" placeholder="News details"></textarea><button onclick="act(\'addNews\',{title:$(\'nt\').value,text:$(\'nb\').value})">Post news</button>'+S.news.map(function(n){return'<p><b>'+esc(n.title)+'</b> <small>'+n.date+'</small><br>'+esc(n.text)+'<br><button class="g" onclick="act(\'delNews\',{id:'+n.id+'})">Remove</button></p>'}).join("")},
gl:function(){return'<label>Add photos (you can pick several)</label><input type="file" accept="image/*" multiple onchange="up(event)"><div class="ph">'+S.photos.map(function(p){return'<div><img src="/api/photo?id='+p.id+'" alt=""><button class="g" onclick="act(\'delPhoto\',{id:\''+p.id+'\'})">Remove</button></div>'}).join("")+'</div>'},
sf:function(){return'<label for="ta">Training days, one per line: Day | Time</label><textarea id="ta">'+esc(S.schedule.map(function(x){return x.d+" | "+x.t}).join("\n"))+'</textarea><label for="tf">Fees, one per line: Name | Amount in naira</label><textarea id="tf">'+esc(S.fees.map(function(x){return x.n+" | "+x.a}).join("\n"))+'</textarea><button onclick="act(\'lists\',{schedule:lines(\'ta\',function(a){return{d:a[0],t:a[1]||\'\'}}),fees:lines(\'tf\',function(a){return{n:a[0],a:a[1]}})})">Save</button>'},
ac:function(){return fld("bankName","Bank name")+fld("acctNo","Account number")+fld("acctName","Account name")+fld("wa","WhatsApp number (digits only, with country code, e.g. 2348012345678)")+fld("phone","Phone number (shown on the website)")+fld("address","Address or training ground location")+'<button onclick="sv([\'bankName\',\'acctNo\',\'acctName\',\'wa\',\'phone\',\'address\'])">Save</button>'},
ws:function(){return fld("tagline","Sentence under the team photo")+'<button onclick="sv([\'tagline\'])">Save</button><label>Team photo on the home page</label><img src="'+(S.settings.heroV?"/api/photo?id=hero&v="+S.settings.heroV:"/hero.jpg")+'" style="max-width:24rem;width:100%;border-radius:.6rem" alt=""><input type="file" accept="image/*" onchange="hero(event)">'},
sc:function(){return'<label for="nc">New admin code (at least 6 characters)</label><input id="nc" type="password"><button onclick="var n=$(\'nc\').value;if(n)act(\'code\',{code:n}).then(function(){C=n;sessionStorage.setItem(\'ac\',n)})">Change code</button>'}};
function view(t){T=t;var inc=S.pays.filter(function(y){return y.st==="Confirmed"}).reduce(function(s,y){return s+y.amt},0);
$("st").innerHTML='<div><b>'+S.players.length+'</b>Players</div><div><b>'+S.players.filter(function(p){return p.st==="Recruited"}).length+'</b>Recruited</div><div><b>'+S.pays.filter(function(y){return y.st==="Pending"}).length+'</b>Pending payments</div><div><b>'+N(inc)+'</b>Confirmed income</div>';
$("tb").innerHTML=TABS.map(function(x){return'<button class="g'+(x[0]===t?' on':'')+'" onclick="view(\''+x[0]+'\')">'+x[1]+'</button>'}).join("");$("v").innerHTML=V[t]()}
if(C){$("c").value=C;go()}
</script></body></html>
